<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PR회사 디렉토리 — 국내외 PR·커뮤니케이션 회사 목록 | PRCOME</title>
<meta name="description" content="국내외 주요 PR·커뮤니케이션(홍보대행) 회사를 한곳에서 검색·비교하세요. 회사를 누르면 PRCOME 상세 소개 페이지로 이동합니다. 한국PR협회 기준 66개사.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../assets/css/magazine-system.css?v=4">
<script>window.MAG={root:'../',home:'../index.html',catBase:'../insights/index.html'};</script>
<style>
.subhead{padding:30px 0 6px}.subhead .crumb{font-size:12.5px;color:var(--sub);margin-bottom:12px}
.subhead .crumb a:hover{color:var(--pt)}
.subhead h1{font-size:clamp(25px,3.2vw,34px);font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:12px}
.subhead h1 .tick{width:26px;height:3px;background:var(--pt);border-radius:2px}
.subhead .desc{font-size:15px;color:var(--sub);margin-top:10px;max-width:64ch;line-height:1.6}
.subhead .desc b{color:var(--ink)}
.subhead .src{font-size:12.5px;color:var(--sub-2);margin-top:10px}.subhead .src a{color:var(--pt);font-weight:600}
.topbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0 6px}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:8px;padding:0 14px;height:48px;background:var(--surf)}
.search:focus-within{border-color:var(--pt);box-shadow:0 0 0 3px var(--pt-soft)}
.search svg{width:18px;height:18px;stroke:var(--sub);fill:none;stroke-width:1.8;flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;font-size:15px}
.tabs{display:flex;gap:8px}
.tabs button{height:48px;border:1px solid var(--line-2);background:var(--surf);border-radius:8px;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--sub);padding:0 15px;cursor:pointer;white-space:nowrap;transition:background var(--dur) var(--ease),color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.tabs button.on{background:var(--pt);color:#fff;border-color:var(--pt)}
.cnt{font-size:13px;color:var(--sub)}.cnt b{color:var(--ink)}
.dlist{border-top:2px solid var(--ink);margin-top:6px}
.drow{display:grid;grid-template-columns:52px 1.4fr 1.1fr auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;transition:background var(--dur) var(--ease)}
.drow:hover{background:linear-gradient(90deg,var(--pt-soft),transparent 65%)}
.drow .lg{width:48px;height:48px;border-radius:10px;background:var(--pt-soft);color:var(--pt);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.drow .nm{font-size:15.5px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.drow:hover .nm{color:var(--pt)}
.drow .gbadge{font-size:10.5px;font-weight:800;color:#fff;background:var(--navy);border-radius:4px;padding:2px 7px}
.drow .rep{font-size:12.5px;color:var(--sub);margin-top:4px}
.drow .biz{font-size:13px;color:var(--sub)}
.drow .biz b{color:var(--sub-2);font-weight:700;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-right:5px}
.drow .go{font-size:12.5px;font-weight:700;color:#fff;background:var(--pt);border-radius:6px;padding:9px 16px;white-space:nowrap;transition:background var(--dur) var(--ease)}
.drow:hover .go{background:var(--pt-2)}
.drow mark{background:#FFF3C4;border-radius:2px}
.empty{padding:36px 0;color:var(--sub-2)}
.note{font-size:12.5px;color:var(--sub-2);line-height:1.7;margin:22px 0 60px;padding-top:18px;border-top:1px solid var(--line)}
.note a{color:var(--pt);font-weight:600}
@media (max-width:820px){.drow{grid-template-columns:44px 1fr auto}.drow .biz{display:none}}
</style>
</head>
<body>
<div id="mag-header"></div>
<div class="wrap">
  <section class="subhead">
    <div class="crumb"><a href="../index.html">홈</a> / <a href="index.html">기업·미디어</a> / PR회사 디렉토리</div>
    <h1><span class="tick"></span>PR회사 디렉토리</h1>
    <p class="desc">국내외 주요 PR·커뮤니케이션(홍보대행) 회사 목록입니다. <b>회사를 누르면 PRCOME 상세 소개 페이지</b>로 이동합니다. 선택 기준·비교가 필요하면 <a href="agencies.html" style="color:var(--pt);font-weight:600">PR회사 찾기 가이드</a>를 참고하세요.</p>
    <div class="src">데이터 출처 · <a href="https://www.koreapr.org/pr-company" target="_blank" rel="noopener">한국PR협회 PR회사 (koreapr.org)</a></div>
  </section>

  <div class="topbar">
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4" stroke-linecap="round"/></svg><input id="q" placeholder="회사명·대표자 검색" oninput="render()"></div>
    <div class="tabs">
      <button class="on" data-f="all" onclick="setF('all')">전체</button>
      <button data-f="global" onclick="setF('global')">외국계·글로벌</button>
      <button data-f="korea" onclick="setF('korea')">국내</button>
    </div>
    <span class="cnt" id="cnt"></span>
  </div>

  <div class="dlist" id="dlist"></div>
  <p class="note">※ 본 디렉토리는 <a href="https://www.koreapr.org/pr-company" target="_blank" rel="noopener">한국PR협회 PR회사</a> 공개 자료를 바탕으로 정리한 참고용 목록입니다. 정보는 변동될 수 있으니 계약 전 각 사 공식 채널에서 확인하세요.</p>
</div>
<div id="mag-footer"></div>
<script src="companies.js?v=2"></script>
<script src="../assets/js/prcome-nav.js?v=1"></script>
<script>
var CO=window.PR_COMPANIES, GLOBAL=window.PR_GLOBAL;
function ini(n){var s=n.replace(/^[㈜（）()주\s]+/,'');return s.charAt(0)||n.charAt(0);}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function hl(s,q){if(!q)return esc(s);return esc(s).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');}
var cur='all';
function setF(f){cur=f;document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.f===f);});render();}
function render(){
 var q=(document.getElementById('q').value||'').trim().toLowerCase();
 var list=CO.filter(function(c){
   var g=!!GLOBAL[c[0]];
   if(cur==='global'&&!g)return false; if(cur==='korea'&&g)return false;
   if(q&&(c[0]+' '+c[1]).toLowerCase().indexOf(q)<0)return false; return true;
 });
 document.getElementById('cnt').innerHTML='등록 PR회사 <b>'+list.length+'</b>곳';
 document.getElementById('dlist').innerHTML=list.map(function(c){
  var g=!!GLOBAL[c[0]];
  return '<a class="drow" href="company.html?c='+CO.indexOf(c)+'">'+
   '<span class="lg">'+ini(c[0])+'</span>'+
   '<span><div class="nm">'+hl(c[0],q)+(g?'<span class="gbadge">글로벌</span>':'')+'</div><div class="rep">대표 '+hl(c[1],q)+'</div></span>'+
   '<span class="biz"><b>업태</b>서비스업 · <b>업종</b>'+(g?'PR·커뮤니케이션(글로벌 네트워크)':'PR·커뮤니케이션(광고·홍보 대행)')+'</span>'+
   '<span class="go">자세히 →</span></a>';
 }).join('')||'<div class="empty">조건에 맞는 회사가 없습니다.</div>';
}
render();
</script>
</body>
</html>
