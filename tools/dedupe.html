<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중복 제거 — PRCOME 유틸리티</title>
<meta name="description" content="줄 단위로 중복된 항목을 제거합니다. 매체 리스트·키워드·이메일 목록 정리에 활용하세요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../assets/css/magazine-system.css?v=4">
<link rel="stylesheet" href="../assets/css/tools.css?v=1">
<script>window.MAG={root:'../',home:'../index.html',catBase:'../insights/index.html'};</script>
</head>
<body>
<div id="mag-header"></div>
<div class="twrap">
  <section class="thero">
    <div class="crumb"><a href="../index.html">홈</a> / <a href="index.html">PR도구</a> / 중복 제거</div>
    <div class="ic"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></div>
    <h1>중복 제거</h1>
    <p class="desc">줄 단위로 중복된 항목을 제거합니다. 매체 리스트, 키워드, 이메일 목록처럼 한 줄에 하나씩 있는 데이터를 정리할 때 유용합니다.</p>
  </section>

  <div class="panel">
    <div class="opts">
      <label class="chk"><input type="checkbox" id="o-case">대소문자 구분</label>
      <label class="chk"><input type="checkbox" id="o-trim" checked>앞뒤 공백 제거</label>
      <label class="chk"><input type="checkbox" id="o-sort">결과 정렬</label>
    </div>
    <div style="height:16px"></div>
    <div class="io">
      <div>
        <label class="lab">입력 <span id="inCnt" class="hint">0줄</span></label>
        <textarea class="inp" id="in" style="min-height:240px" oninput="run()">브릿지커뮤니케이션즈
스토리브릭스
브릿지커뮤니케이션즈
미디어웨이브
스토리브릭스
경제산업신문
미디어웨이브</textarea>
      </div>
      <div>
        <label class="lab ohead"><span>결과</span><button class="copy" onclick="cp()">복사</button></label>
        <textarea class="inp" id="out" style="min-height:240px;background:#fff" readonly></textarea>
      </div>
    </div>
    <div class="btnrow">
      <button class="btn" onclick="run()">중복 제거</button>
      <button class="btn-2" onclick="document.getElementById('in').value='';run();">초기화</button>
    </div>
    <div class="result" id="resBox" style="padding:14px 18px"><span class="cnt" id="res"></span></div>
  </div>
  <div style="height:44px"></div>
</div>
<div id="mag-footer"></div>
<script>(function(){var s=document.createElement("script");s.src="../assets/js/prcome-nav.js?t="+Date.now();document.head.appendChild(s);})();</script>
<script>
function run(){
  var raw=document.getElementById('in').value;
  var caseSensitive=document.getElementById('o-case').checked;
  var trim=document.getElementById('o-trim').checked;
  var sort=document.getElementById('o-sort').checked;
  var lines=raw.split(/\r?\n/);
  var inputCount=raw===''?0:lines.length;
  document.getElementById('inCnt').textContent=inputCount+'줄';
  var seen={}, out=[];
  lines.forEach(function(line){
    var v=trim?line.trim():line;
    var key=caseSensitive?v:v.toLowerCase();
    if(Object.prototype.hasOwnProperty.call(seen,key))return;
    seen[key]=1; out.push(v);
  });
  if(sort) out.sort(function(a,b){return a.localeCompare(b,'ko');});
  document.getElementById('out').value=out.join('\n');
  var removed=inputCount-out.length; if(removed<0)removed=0;
  document.getElementById('res').innerHTML='결과 <b>'+out.length+'줄</b> · <span style="color:#E4612B">'+removed+'개 제거</span> · 입력 '+inputCount+'줄';
}
function cp(){var t=document.getElementById('out').value;if(navigator.clipboard&&t){navigator.clipboard.writeText(t).then(function(){var b=event.target;b.textContent='복사됨';setTimeout(function(){b.textContent='복사';},1200);});}}
run();
</script>
</body>
</html>
