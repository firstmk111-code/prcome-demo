<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중복 제거 — PRCOME 유틸리티</title>
<meta name="description" content="줄 단위로 중복된 항목을 제거합니다. 매체 리스트·키워드·이메일 목록 정리에 활용하세요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../assets/css/magazine-system.css?v=4">
<script>window.MAG={root:'../',home:'../index.html',catBase:'../insights/index.html'};</script>
<style>
.subhead{padding:30px 0 6px}.subhead .crumb{font-size:12.5px;color:var(--sub);margin-bottom:12px}.subhead .crumb a:hover{color:var(--pt)}
.subhead h1{font-size:clamp(24px,3vw,32px);font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:12px}
.subhead h1 .tick{width:26px;height:3px;background:var(--pt);border-radius:2px}
.subhead .desc{font-size:15.5px;color:var(--sub);margin-top:10px;max-width:60ch;line-height:1.6}
.tool{padding:24px 0 10px}
.io{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tool label{display:block;font-size:13px;font-weight:700;margin:0 0 7px;color:var(--ink)}
.tool textarea{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:13px;font-family:inherit;font-size:14.5px;color:var(--ink);background:var(--surf);outline:0;min-height:240px;line-height:1.65;resize:vertical}
.tool textarea:focus{border-color:var(--pt);box-shadow:0 0 0 3px var(--pt-soft)}
.tool textarea[readonly]{background:#FBFCFE}
.opts{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:16px 0}
.opt{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--sub);cursor:pointer}
.opt input{width:17px;height:17px;accent-color:var(--pt)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn-run{height:44px;border:0;border-radius:8px;background:var(--pt);color:#fff;font-weight:700;font-size:14.5px;padding:0 22px;cursor:pointer}
.btn-run:hover{background:var(--pt-2)}
.btn-ghost{height:44px;border:1px solid var(--line-2);border-radius:8px;background:var(--surf);color:var(--ink);font-weight:700;font-size:13.5px;padding:0 16px;cursor:pointer}
.btn-ghost:hover{border-color:var(--pt);color:var(--pt)}
.res{font-size:13.5px;color:var(--sub);margin-top:14px}.res b{color:var(--ink)}.res .rm{color:#E4612B;font-weight:700}
.ohead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.copy{font-size:12.5px;font-weight:700;color:var(--pt);border:1px solid var(--pt);border-radius:7px;padding:6px 12px;background:none;cursor:pointer}
.copy:hover{background:var(--pt-soft)}
@media (max-width:760px){.io{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="mag-header"></div>
<div class="wrap">
  <section class="subhead">
    <div class="crumb"><a href="../index.html">홈</a> / <a href="index.html">PR도구</a> / 중복 제거</div>
    <h1><span class="tick"></span>중복 제거</h1>
    <p class="desc">줄 단위로 중복된 항목을 제거합니다. 매체 리스트, 키워드, 이메일 목록처럼 한 줄에 하나씩 있는 데이터를 정리할 때 유용합니다.</p>
  </section>
  <div class="tool">
    <div class="opts">
      <label class="opt"><input type="checkbox" id="o-trim" checked>앞뒤 공백 무시</label>
      <label class="opt"><input type="checkbox" id="o-case">대소문자 무시</label>
      <label class="opt"><input type="checkbox" id="o-empty" checked>빈 줄 제거</label>
      <label class="opt"><input type="checkbox" id="o-sort">가나다/알파벳 정렬</label>
    </div>
    <div class="io">
      <div>
        <label>입력 (한 줄에 하나씩)</label>
        <textarea id="in" oninput="run()">브릿지커뮤니케이션즈
스토리브릭스
브릿지커뮤니케이션즈
미디어웨이브
스토리브릭스
경제산업신문
미디어웨이브</textarea>
      </div>
      <div>
        <label class="ohead"><span>결과</span><button class="copy" onclick="cp()">복사</button></label>
        <textarea id="out" readonly></textarea>
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn-run" onclick="run()">중복 제거</button>
      <button class="btn-ghost" onclick="document.getElementById('in').value='';run();">입력 지우기</button>
    </div>
    <div class="res" id="res"></div>
  </div>
  <div style="height:50px"></div>
</div>
<div id="mag-footer"></div>
<script>(function(){var s=document.createElement("script");s.src="../assets/js/prcome-nav.js?t="+Date.now();document.head.appendChild(s);})();</script>
<script>
function run(){
  var raw=document.getElementById('in').value;
  var trim=document.getElementById('o-trim').checked;
  var ci=document.getElementById('o-case').checked;
  var rmEmpty=document.getElementById('o-empty').checked;
  var sort=document.getElementById('o-sort').checked;
  var lines=raw.split(/\r?\n/);
  var seen={}, out=[], total=0;
  lines.forEach(function(line){
    var v=trim?line.trim():line;
    if(rmEmpty && v==='') return;
    total++;
    var key=ci?v.toLowerCase():v;
    if(Object.prototype.hasOwnProperty.call(seen,key)) return;
    seen[key]=1; out.push(v);
  });
  if(sort) out.sort(function(a,b){return a.localeCompare(b,'ko');});
  document.getElementById('out').value=out.join('\n');
  var removed=total-out.length;
  document.getElementById('res').innerHTML='원본 <b>'+total+'줄</b> → 중복 제거 후 <b>'+out.length+'줄</b> · 제거된 중복 <span class="rm">'+removed+'개</span>';
}
function cp(){var t=document.getElementById('out').value;if(navigator.clipboard&&t){navigator.clipboard.writeText(t).then(function(){var b=event.target;b.textContent='복사됨';setTimeout(function(){b.textContent='복사';},1200);});}}
run();
</script>
</body>
</html>
