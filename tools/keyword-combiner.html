<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>키워드 조합기 — PRCOME 유틸리티</title>
<meta name="description" content="여러 키워드 그룹을 조합해 가능한 모든 키워드를 한 번에 생성합니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../assets/css/magazine-system.css?v=4">
<link rel="stylesheet" href="../assets/css/tools.css?v=1">
<script>window.MAG={root:'../',home:'../index.html',catBase:'../insights/index.html'};</script>
</head>
<body>
<div id="mag-header"></div>
<div class="twrap">
  <section class="thero">
    <div class="crumb"><a href="../index.html">홈</a> / <a href="index.html">PR도구</a> / 키워드 조합기</div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg></div>
    <h1>키워드 조합기</h1>
    <p class="desc">여러 키워드 그룹을 넣으면 가능한 모든 조합을 만들어 드립니다. 지역×서비스, 브랜드×키워드처럼 보도자료·SEO·광고 키워드 확장에 활용하세요.</p>
  </section>

  <div class="panel">
    <div class="grid3">
      <div><label class="lab">그룹 1 <span class="hint">필수 · 쉼표/줄바꿈</span></label><textarea class="inp" id="g1">서울, 부산, 대구</textarea></div>
      <div><label class="lab">그룹 2 <span class="hint">필수 · 쉼표/줄바꿈</span></label><textarea class="inp" id="g2">홍보대행, PR회사, 보도자료</textarea></div>
      <div><label class="lab">그룹 3 <span class="hint">선택</span></label><textarea class="inp" id="g3">추천, 비용, 후기</textarea></div>
    </div>
    <div class="opts" style="margin-top:16px">
      <label class="chk"><input type="checkbox" id="o-space" checked>키워드 사이 공백 추가</label>
      <label class="chk"><input type="checkbox" id="o-rev">역순 조합도 생성</label>
    </div>
    <div class="btnrow"><button class="btn" onclick="gen()">조합 생성</button></div>

    <div class="result" id="out" style="display:none">
      <div class="rh"><span class="cnt" id="cnt"></span><button class="copy" onclick="copyAll()">복사</button></div>
      <div class="chips" id="chips"></div>
      <p class="note" id="warn" style="margin-top:12px"></p>
    </div>
  </div>
  <div style="height:44px"></div>
</div>
<div id="mag-footer"></div>
<script>(function(){var s=document.createElement("script");s.src="../assets/js/prcome-nav.js?t="+Date.now();document.head.appendChild(s);})();</script>
<script>
function parse(id){return (document.getElementById(id).value||'').split(/[\n,]/).map(function(s){return s.trim();}).filter(Boolean);}
var LAST=[];
function gen(){
  var groups=[parse('g1'),parse('g2'),parse('g3')].filter(function(a){return a.length;});
  if(!groups.length){document.getElementById('out').style.display='none';return;}
  var sp=document.getElementById('o-space').checked?' ':'';
  var rev=document.getElementById('o-rev').checked;
  var combos=groups.reduce(function(acc,arr){var out=[];acc.forEach(function(p){arr.forEach(function(w){out.push(p.concat(w));});});return out;},[[]]);
  var res=[];
  combos.forEach(function(parts){res.push(parts.join(sp));if(rev&&parts.length>1)res.push(parts.slice().reverse().join(sp));});
  res=res.filter(function(v,i){return res.indexOf(v)===i;});
  LAST=res;
  document.getElementById('out').style.display='block';
  document.getElementById('cnt').innerHTML='조합 결과 <b>'+res.length+'개</b>';
  var LIMIT=600, shown=res.slice(0,LIMIT);
  document.getElementById('chips').innerHTML=shown.map(function(k){return '<span>'+k.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];})+'</span>';}).join('');
  document.getElementById('warn').textContent=res.length>LIMIT?('※ 상위 '+LIMIT+'개만 표시했습니다. (복사에는 전체 포함)'):'';
}
function copyAll(){var t=LAST.join('\n');if(navigator.clipboard&&t){navigator.clipboard.writeText(t).then(function(){var b=event.target;b.textContent='복사됨';setTimeout(function(){b.textContent='복사';},1200);});}else alert(t);}
gen();
</script>
</body>
</html>
