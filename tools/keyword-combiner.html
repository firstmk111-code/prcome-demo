<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>키워드 조합기 — PRCOME 유틸리티</title>
<meta name="description" content="여러 키워드 그룹을 조합해 가능한 모든 키워드를 한 번에 생성합니다. 보도자료·SEO·광고 키워드 확장에 활용하세요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../assets/css/magazine-system.css?v=4">
<script>window.MAG={root:'../',home:'../index.html',catBase:'../insights/index.html'};</script>
<style>
.subhead{padding:30px 0 6px}.subhead .crumb{font-size:12.5px;color:var(--sub);margin-bottom:12px}.subhead .crumb a:hover{color:var(--pt)}
.subhead h1{font-size:clamp(24px,3vw,32px);font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:12px}
.subhead h1 .tick{width:26px;height:3px;background:var(--pt);border-radius:2px}
.subhead .desc{font-size:15.5px;color:var(--sub);margin-top:10px;max-width:60ch;line-height:1.6}
.tool{padding:24px 0 10px}
.grp{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tool label{display:block;font-size:13px;font-weight:700;margin:0 0 7px;color:var(--ink)}
.tool label .hint{font-weight:500;color:var(--sub-2);font-size:12px;margin-left:4px}
.tool textarea{width:100%;border:1px solid var(--line-2);border-radius:8px;padding:12px 13px;font-family:inherit;font-size:14.5px;color:var(--ink);background:var(--surf);outline:0;min-height:96px;line-height:1.6;resize:vertical}
.tool textarea:focus{border-color:var(--pt);box-shadow:0 0 0 3px var(--pt-soft)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surf);font-family:inherit;font-size:13px;font-weight:700;color:var(--sub);padding:9px 13px;cursor:pointer}
.seg button.on{background:var(--pt);color:#fff}
.btn-run{height:44px;border:0;border-radius:8px;background:var(--pt);color:#fff;font-weight:700;font-size:14.5px;padding:0 22px;cursor:pointer}
.btn-run:hover{background:var(--pt-2)}
.out{margin-top:22px;border-top:2px solid var(--ink);padding-top:14px}
.out .oh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.out .cnt{font-size:14px;font-weight:700}.out .cnt b{color:var(--pt)}
.copy{font-size:12.5px;font-weight:700;color:var(--pt);border:1px solid var(--pt);border-radius:7px;padding:8px 14px;background:none;cursor:pointer}
.copy:hover{background:var(--pt-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font-size:13.5px;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:7px;padding:7px 12px}
.note{font-size:12.5px;color:var(--sub-2);margin-top:14px;line-height:1.6}
@media (max-width:760px){.grp{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="mag-header"></div>
<div class="wrap">
  <section class="subhead">
    <div class="crumb"><a href="../index.html">홈</a> / <a href="index.html">PR도구</a> / 키워드 조합기</div>
    <h1><span class="tick"></span>키워드 조합기</h1>
    <p class="desc">여러 키워드 그룹을 넣으면 가능한 모든 조합을 만들어 드립니다. 지역×서비스, 브랜드×키워드처럼 보도자료·SEO·광고 키워드 확장에 활용하세요.</p>
  </section>
  <div class="tool">
    <div class="grp">
      <div><label>그룹 1 <span class="hint">쉼표 또는 줄바꿈</span></label><textarea id="g1">서울, 부산, 대구</textarea></div>
      <div><label>그룹 2 <span class="hint">쉼표 또는 줄바꿈</span></label><textarea id="g2">홍보대행, PR회사, 보도자료</textarea></div>
      <div><label>그룹 3 <span class="hint">선택</span></label><textarea id="g3">추천, 비용, 후기</textarea></div>
    </div>
    <div class="row">
      <span style="font-size:13px;font-weight:700">구분자</span>
      <div class="seg" id="sep">
        <button class="on" data-s=" ">공백</button>
        <button data-s="·">·</button>
        <button data-s="-">-</button>
        <button data-s="">붙여쓰기</button>
      </div>
      <button class="btn-run" onclick="gen()">조합 생성</button>
    </div>
    <div class="out" id="out" style="display:none">
      <div class="oh"><span class="cnt" id="cnt"></span><button class="copy" onclick="copyAll()">전체 복사</button></div>
      <div class="chips" id="chips"></div>
      <p class="note" id="warn"></p>
    </div>
  </div>
  <div style="height:50px"></div>
</div>
<div id="mag-footer"></div>
<script>(function(){var s=document.createElement("script");s.src="../assets/js/prcome-nav.js?t="+Date.now();document.head.appendChild(s);})();</script>
<script>
var sep=' ';
document.getElementById('sep').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b)return;
  [].forEach.call(this.querySelectorAll('button'),function(x){x.classList.remove('on');});
  b.classList.add('on'); sep=b.getAttribute('data-s');
});
function parse(id){return (document.getElementById(id).value||'').split(/[\n,]/).map(function(s){return s.trim();}).filter(Boolean);}
var LAST=[];
function gen(){
  var groups=[parse('g1'),parse('g2'),parse('g3')].filter(function(a){return a.length;});
  if(!groups.length){document.getElementById('out').style.display='none';return;}
  var res=groups.reduce(function(acc,arr){
    var out=[];
    acc.forEach(function(prefix){arr.forEach(function(w){out.push(prefix.concat(w));});});
    return out;
  },[[]]).map(function(parts){return parts.join(sep);});
  // 중복 제거
  res=res.filter(function(v,i){return res.indexOf(v)===i;});
  LAST=res;
  document.getElementById('out').style.display='block';
  document.getElementById('cnt').innerHTML='생성된 조합 <b>'+res.length+'개</b>';
  var LIMIT=500, shown=res.slice(0,LIMIT);
  document.getElementById('chips').innerHTML=shown.map(function(k){return '<span>'+k.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];})+'</span>';}).join('');
  document.getElementById('warn').textContent=res.length>LIMIT?('※ 너무 많아 상위 '+LIMIT+'개만 표시했습니다. (전체 복사에는 모두 포함)'):'';
}
function copyAll(){
  var t=LAST.join('\n');
  if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){var b=event.target;b.textContent='복사됨';setTimeout(function(){b.textContent='전체 복사';},1200);});}
  else alert(t);
}
gen();
</script>
</body>
</html>
