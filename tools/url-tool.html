<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL 인코더/디코더 — PRCOME 유틸리티</title>
<meta name="description" content="URL을 인코딩·디코딩합니다. UTM 파라미터, 한글 링크, 공유 URL 처리에 활용하세요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../assets/css/magazine-system.css?v=4">
<link rel="stylesheet" href="../assets/css/tools.css?v=1">
<script>window.MAG={root:'../',home:'../index.html',catBase:'../insights/index.html'};</script>
<style>#in,#out{font-family:'Pretendard',ui-monospace,monospace;word-break:break-all}</style>
</head>
<body>
<div id="mag-header"></div>
<div class="twrap">
  <section class="thero">
    <div class="crumb"><a href="../index.html">홈</a> / <a href="index.html">PR도구</a> / URL 인코더·디코더</div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></svg></div>
    <h1>URL 인코더 / 디코더</h1>
    <p class="desc">URL을 인코딩(퍼센트 인코딩)하거나 다시 원래대로 디코딩합니다. UTM 파라미터, 한글이 포함된 링크, 공유 URL을 처리할 때 사용하세요.</p>
  </section>

  <div class="panel">
    <div class="pills" id="mode">
      <label class="on"><input type="radio" name="m" value="component" checked>컴포넌트 (파라미터 값)</label>
      <label><input type="radio" name="m" value="uri">전체 URI</label>
    </div>
    <label class="lab">원본 텍스트/URL</label>
    <textarea class="inp" id="in" style="min-height:120px">https://prcome.com/검색?q=언론 홍보&utm_source=뉴스레터</textarea>
    <div class="btnrow">
      <button class="btn" onclick="enc()">인코딩 →</button>
      <button class="btn nav" onclick="dec()">← 디코딩</button>
      <button class="btn-2" onclick="swap()">입력↔결과 교체</button>
      <button class="btn-2" onclick="document.getElementById('in').value='';document.getElementById('out').value='';document.getElementById('err').textContent=''">지우기</button>
    </div>
    <div class="err" id="err"></div>
    <label class="lab ohead" style="margin-top:18px"><span>결과</span><button class="copy" onclick="cp()">복사</button></label>
    <textarea class="inp" id="out" style="min-height:120px;background:#fff" readonly></textarea>
    <p class="note">※ ‘컴포넌트’는 파라미터 값 하나를 인코딩할 때(encodeURIComponent), ‘전체 URI’는 링크 전체를 인코딩할 때(encodeURI) 적합합니다. 모든 처리는 브라우저 안에서만 이뤄지며 서버로 전송되지 않습니다.</p>
  </div>
  <div style="height:44px"></div>
</div>
<div id="mag-footer"></div>
<script>(function(){var s=document.createElement("script");s.src="../assets/js/prcome-nav.js?t="+Date.now();document.head.appendChild(s);})();</script>
<script>
var mode='component';
document.getElementById('mode').addEventListener('click',function(e){var b=e.target.closest('label');if(!b)return;[].forEach.call(this.querySelectorAll('label'),function(x){x.classList.remove('on');});b.classList.add('on');b.querySelector('input').checked=true;mode=b.querySelector('input').value;});
function setErr(m){document.getElementById('err').textContent=m||'';}
function enc(){var t=document.getElementById('in').value;try{document.getElementById('out').value=mode==='uri'?encodeURI(t):encodeURIComponent(t);setErr('');}catch(e){setErr('인코딩 오류: '+e.message);}}
function dec(){var t=document.getElementById('in').value;try{document.getElementById('out').value=mode==='uri'?decodeURI(t):decodeURIComponent(t);setErr('');}catch(e){setErr('디코딩할 수 없는 형식입니다. (잘못된 % 시퀀스)');}}
function swap(){var i=document.getElementById('in'),o=document.getElementById('out');var tmp=i.value;i.value=o.value;o.value=tmp;}
function cp(){var t=document.getElementById('out').value;if(navigator.clipboard&&t){navigator.clipboard.writeText(t).then(function(){var b=event.target;b.textContent='복사됨';setTimeout(function(){b.textContent='복사';},1200);});}}
enc();
</script>
</body>
</html>
