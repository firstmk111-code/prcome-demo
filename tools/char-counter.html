<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글자수 세기 — PRCOME 유틸리티</title>
<meta name="description" content="글자수(공백 포함/제외)·단어·줄·문단·바이트를 실시간으로 셉니다. 플랫폼별 글자수 제한 안내 포함.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../assets/css/magazine-system.css?v=4">
<link rel="stylesheet" href="../assets/css/tools.css?v=1">
<script>window.MAG={root:'../',home:'../index.html',catBase:'../insights/index.html'};</script>
</head>
<body>
<div id="mag-header"></div>
<div class="twrap">
  <section class="thero">
    <div class="crumb"><a href="../index.html">홈</a> / <a href="index.html">PR도구</a> / 글자수 세기</div>
    <div class="ic"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h4"/></svg></div>
    <h1>글자수 세기</h1>
    <p class="desc">입력한 글의 글자수·단어·줄·문단·바이트를 실시간으로 셉니다. 보도자료 제목·본문이나 SNS 글의 길이를 점검할 때 유용합니다.</p>
  </section>

  <div class="panel">
    <div class="statgrid">
      <div class="stat"><b id="s-char">0</b><span>글자수(공백 포함)</span></div>
      <div class="stat"><b id="s-nospace">0</b><span>공백 제외</span></div>
      <div class="stat"><b id="s-word">0</b><span>단어수</span></div>
      <div class="stat"><b id="s-line">0</b><span>줄수</span></div>
      <div class="stat"><b id="s-para">0</b><span>문단수</span></div>
      <div class="stat"><b id="s-byte">0</b><span>바이트(UTF-8)</span></div>
    </div>
    <div style="height:18px"></div>
    <textarea class="inp" id="txt" style="min-height:220px;font-size:15.5px" placeholder="여기에 텍스트를 입력하거나 붙여넣으세요." oninput="upd()"></textarea>
    <div class="btnrow">
      <button class="btn-2" onclick="document.getElementById('txt').value='';upd();document.getElementById('txt').focus()">지우기</button>
      <button class="btn-2" onclick="cp()">텍스트 복사</button>
    </div>
    <div class="guide">
      <span class="g"><span class="dot"></span>네이버 블로그 제목 100자</span>
      <span class="g"><span class="dot"></span>트위터(X) 280자</span>
      <span class="g"><span class="dot"></span>인스타그램 캡션 2,200자</span>
      <span class="g"><span class="dot"></span>카카오톡 프로필 60자</span>
    </div>
  </div>
  <div style="height:44px"></div>
</div>
<div id="mag-footer"></div>
<script>(function(){var s=document.createElement("script");s.src="../assets/js/prcome-nav.js?t="+Date.now();document.head.appendChild(s);})();</script>
<script>
function byteLen(s){var b=0;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);b+= c<0x80?1:c<0x800?2:(c>=0xD800&&c<=0xDBFF?(i++,4):3);}return b;}
function fmt(n){return n.toLocaleString('ko-KR');}
function upd(){
  var t=document.getElementById('txt').value;
  var chars=Array.from(t).length;
  var nospace=Array.from(t.replace(/\s/g,'')).length;
  var words=(t.trim().match(/\S+/g)||[]).length;
  var lines=t===''?0:t.split(/\n/).length;
  var paras=t.trim()===''?0:t.trim().split(/\n\s*\n/).filter(function(s){return s.trim();}).length;
  document.getElementById('s-char').textContent=fmt(chars);
  document.getElementById('s-nospace').textContent=fmt(nospace);
  document.getElementById('s-word').textContent=fmt(words);
  document.getElementById('s-line').textContent=fmt(lines);
  document.getElementById('s-para').textContent=fmt(paras);
  document.getElementById('s-byte').textContent=fmt(byteLen(t));
}
function cp(){var t=document.getElementById('txt').value;if(navigator.clipboard&&t){navigator.clipboard.writeText(t).then(function(){var b=event.target;b.textContent='복사됨';setTimeout(function(){b.textContent='텍스트 복사';},1200);});}}
upd();
</script>
</body>
</html>
