<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제목 생성기 — PRCOME 유틸리티</title>
<meta name="description" content="핵심 키워드와 콘텐츠 유형에 맞춰 클릭을 부르는 제목 후보를 자동 생성합니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../assets/css/magazine-system.css?v=4">
<link rel="stylesheet" href="../assets/css/tools.css?v=1">
<script>window.MAG={root:'../',home:'../index.html',catBase:'../insights/index.html'};</script>
</head>
<body>
<div id="mag-header"></div>
<div class="twrap">
  <section class="thero">
    <div class="crumb"><a href="../index.html">홈</a> / <a href="index.html">PR도구</a> / 제목 생성기</div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M6 4v16M18 4v16M6 12h12"/></svg></div>
    <h1>제목 생성기</h1>
    <p class="desc">핵심 키워드와 콘텐츠 유형을 고르면 클릭을 부르는 제목 후보를 만들어 드립니다. 블로그·유튜브·SNS·뉴스 각 채널의 문법에 맞춰 제안합니다.</p>
  </section>

  <div class="panel">
    <label class="lab">핵심 키워드</label>
    <input class="inp" type="text" id="kw" value="언론홍보" placeholder="예: 비건 간편식, 홍보대행, 스타트업 PR">
    <div class="pills" id="types">
      <label class="on"><input type="radio" name="ty" value="blog" checked>블로그</label>
      <label><input type="radio" name="ty" value="youtube">유튜브</label>
      <label><input type="radio" name="ty" value="sns">SNS</label>
      <label><input type="radio" name="ty" value="news">뉴스·기사</label>
    </div>
    <div class="btnrow"><button class="btn" onclick="gen()">제목 생성</button></div>

    <div class="result" id="res" style="display:none"></div>
    <p class="note">※ 생성 결과는 템플릿 기반 초안입니다. 과장·미검증 표현을 검토하고 채널·사실에 맞게 다듬어 사용하세요.</p>
  </div>
  <div style="height:44px"></div>
</div>
<div id="mag-footer"></div>
<script>(function(){var s=document.createElement("script");s.src="../assets/js/prcome-nav.js?t="+Date.now();document.head.appendChild(s);})();</script>
<script>
var T={
 blog:['{k} 완벽 정리 — 지금 꼭 알아야 할 7가지','초보자를 위한 {k} 시작 가이드 (2026 최신)','{k}, 이것만 알면 충분합니다','실무자가 알려주는 {k} 하는 법','{k} 트렌드 총정리 — 올해 달라진 점','한눈에 보는 {k} 체크리스트','{k}로 성과 낸 사람들의 공통점'],
 youtube:['{k}, 이렇게 하면 실패 안 합니다','단 5분 만에 이해하는 {k}','아직도 {k} 모르세요? (완전정복)','{k}의 진짜 현실 — 해본 사람만 압니다','{k} A to Z, 이 영상 하나로 끝','전문가가 말하는 {k}의 핵심','{k} 시작 전에 꼭 봐야 할 영상'],
 sns:['요즘 다들 한다는 {k} ✨','{k} 꿀팁 대방출 (저장 필수 🔖)','이거 모르면 손해! {k}','{k} 하는 사람 주목 👀','3초 만에 이해하는 {k}','{k}, 지금 시작해도 안 늦어요','오늘의 {k} 한 줄 팁'],
 news:['{k}, 업계 판도 바꾼다','{k} 확산… 시장 반응은','‘{k}’ 주목… 전문가 분석 나와','{k} 도입 기업 늘어난다','[집중] {k}, 무엇이 달라지나','{k} 둘러싼 논의 본격화','{k} 성장세… 향후 전망은']};
document.getElementById('types').addEventListener('click',function(e){var l=e.target.closest('label');if(!l)return;[].forEach.call(this.querySelectorAll('label'),function(x){x.classList.remove('on');});l.classList.add('on');l.querySelector('input').checked=true;});
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function gen(){
  var k=(document.getElementById('kw').value||'').trim()||'키워드';
  var ty=document.querySelector('input[name=ty]:checked').value;
  var list=T[ty].map(function(t){return t.replace(/\{k\}/g,k);});
  var LB={blog:'블로그',youtube:'유튜브',sns:'SNS',news:'뉴스·기사'};
  var el=document.getElementById('res'); el.style.display='block';
  el.innerHTML='<div class="rlab">생성된 제목 · '+LB[ty]+' '+list.length+'개</div><div class="titlelist">'+
    list.map(function(t){return '<div class="tr"><span class="tt">'+esc(t)+'</span><button class="copy" onclick="cp(this)">복사</button></div>';}).join('')+'</div>';
}
function cp(b){var t=b.parentNode.querySelector('.tt').innerText;if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){b.textContent='복사됨';setTimeout(function(){b.textContent='복사';},1200);});}else alert(t);}
gen();
</script>
</body>
</html>
